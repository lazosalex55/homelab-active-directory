<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" role="img" aria-label="Home lab architecture: DC01, CLIENT1 and Monitor-Ubuntu on the LabNet internal network">
  <rect width="760" height="470" fill="#ffffff"/>
  <text x="24" y="32" font-size="16" font-weight="600" fill="#0f1720">Three VMs on an isolated lab network, watched by a Wireshark sensor</text>

  <!-- Internet -->
  <rect x="290" y="52" width="180" height="36" rx="8" fill="none" stroke="#6b7785" stroke-width="1.25"/>
  <text x="380" y="75" text-anchor="middle" fill="#0f1720">Internet</text>
  <g fill="none" stroke="#6b7785" stroke-width="1.25">
    <path d="M145 160V70H290"/>
    <path d="M615 160V70H470"/>
  </g>
  <text x="153" y="134" font-size="11.5" fill="#55606c">NAT adapter</text>
  <text x="623" y="134" font-size="11.5" fill="#55606c">NAT adapter</text>

  <!-- Host -->
  <rect x="20" y="108" width="720" height="342" rx="10" fill="none" stroke="#9aa5b1" stroke-dasharray="4 4"/>
  <text x="36" y="434" font-size="11.5" fill="#55606c">Host PC · Windows 11 · 32 GB RAM · Oracle VirtualBox 7.2</text>

  <!-- DC01 -->
  <rect x="40" y="160" width="210" height="118" rx="8" fill="none" stroke="#6b7785" stroke-width="1.25"/>
  <text x="56" y="184" font-weight="600" fill="#0f1720">DC01</text>
  <text x="56" y="202" font-size="11.5" fill="#0f1720">Windows Server 2025</text>
  <text x="56" y="219" font-size="11.5" fill="#0f1720">AD DS + DNS</text>
  <text x="56" y="236" font-size="11.5" fill="#0f1720">Domain: homelab.local</text>
  <text x="56" y="260" font-size="11.5" fill="#55606c">8 GB · 4 vCPU · 80 GB</text>

  <!-- CLIENT1 -->
  <rect x="275" y="160" width="210" height="118" rx="8" fill="none" stroke="#6b7785" stroke-width="1.25"/>
  <text x="291" y="184" font-weight="600" fill="#0f1720">CLIENT1</text>
  <text x="291" y="202" font-size="11.5" fill="#0f1720">Windows 11 Pro</text>
  <text x="291" y="219" font-size="11.5" fill="#0f1720">Domain workstation</text>
  <text x="291" y="236" font-size="11.5" fill="#0f1720">Group Policy target</text>
  <text x="291" y="260" font-size="11.5" fill="#55606c">6 GB · 2 vCPU · 80 GB</text>

  <!-- Monitor -->
  <rect x="510" y="160" width="210" height="118" rx="8" fill="#e6f6ef" stroke="#2f9e75" stroke-width="2"/>
  <text x="526" y="184" font-weight="600" fill="#0f1720">Monitor-Ubuntu</text>
  <text x="526" y="202" font-size="11.5" fill="#0f1720">Ubuntu 24.04 LTS</text>
  <text x="526" y="219" font-size="11.5" fill="#0f1720">Docker → Wireshark</text>
  <text x="526" y="236" font-size="11.5" fill="#0f1720">Web UI on port 3000</text>
  <text x="526" y="260" font-size="11.5" fill="#55606c">4 GB · 2 vCPU · 40 GB</text>

  <!-- LabNet links -->
  <g fill="none" stroke="#6b7785" stroke-width="1.25">
    <path d="M145 278V362"/>
    <path d="M380 278V362"/>
  </g>
  <path d="M615 278V362" fill="none" stroke="#2f9e75" stroke-width="2"/>
  <text x="153" y="318" font-size="11.5" fill="#55606c">10.10.10.10</text>
  <text x="388" y="318" font-size="11.5" fill="#55606c">10.10.10.30</text>
  <text x="623" y="312" font-size="11.5" fill="#55606c">10.10.10.20</text>
  <text x="623" y="328" font-size="11.5" fill="#55606c">promiscuous</text>

  <!-- LabNet bar -->
  <rect x="40" y="362" width="680" height="38" rx="8" fill="#eef1f4" stroke="#6b7785" stroke-width="1.25"/>
  <text x="380" y="386" text-anchor="middle" font-weight="600" fill="#0f1720">LabNet internal network · 10.10.10.0/24 · DNS 10.10.10.10</text>
</svg>
